[package]
name = "gloamux-rdp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
anyhow = "1"
aes = "=0.9.4"
des = "0.8"
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
getrandom = "=0.3.4"
md-5 = "=0.10.6"
num-bigint = "=0.4.8"
ironrdp-blocking = "=0.12.0"
ironrdp-connector = "=0.12.0"
ironrdp-cliprdr = "=0.9.0"
ironrdp-core = "=0.3.1"
ironrdp-displaycontrol = "=0.10.0"
ironrdp-dvc = "=0.10.0"
ironrdp-graphics = "=0.11.0"
ironrdp-input = "=0.9.0"
ironrdp-pdu = "=0.11.0"
ironrdp-session = "=0.13.0"
ironrdp-tls = { version = "=0.3.0", features = ["rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x509-cert = "0.3"

[profile.release]
strip = "symbols"
